

services:
  db:
    image: postgres:16-alpine
    container_name: operabeauty-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: operabeauty
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - operabeauty-pgdata:/var/lib/postgresql/data
      # Script DDL auto-gerado para inicializar o banco de dados limpo na VPS
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          cpus: '1.50'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - operabeauty-network

  redis:
    image: redis:7-alpine
    container_name: operabeauty-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    networks:
      - operabeauty-network

  api:
    image: ${API_IMAGE:-operabeauty-api}:${IMAGE_TAG:-latest}
    build: ./backend
    container_name: operabeauty-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-5001}:5000"
    environment:
      # O backend vai conectar no DB usando o nome do container "db" em vez de localhost
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: operabeauty
      PORT: 5000
      TZ: America/Sao_Paulo
      JWT_SECRET: ${JWT_SECRET}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173,http://localhost}
      WA_GATEWAY_URL: http://wa-gateway:4000
      INTERNAL_SECRET: ${INTERNAL_SECRET:-operabeauty-m2m-internal-secret-token-32chars}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - operabeauty-uploads:/usr/src/app/public/uploads
      - operabeauty-private-uploads:/usr/src/app/private_uploads
      - ./migrations:/usr/src/app/migrations:ro
      - ./scripts:/usr/src/app/scripts:ro
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 768M
        reservations:
          cpus: '0.20'
          memory: 128M
    networks:
      - operabeauty-network

  wa-gateway:
    image: ${WA_GATEWAY_IMAGE:-operabeauty-wa-gateway}:${IMAGE_TAG:-latest}
    build: ./gateway-whatsapp
    container_name: operabeauty-wa-gateway
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    # SEM PORTAS MAPEADAS NO HOST - Blindagem total contra internet externa (01-security-constitution)
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: operabeauty
      PORT: 4000
      TZ: America/Sao_Paulo
      REDIS_URL: redis://redis:6379
      WHATSAPP_ENCRYPTION_KEY: ${WHATSAPP_ENCRYPTION_KEY:-${ENCRYPTION_KEY}}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-operabeauty-m2m-internal-secret-token-32chars}
      API_WEBHOOK_URL: http://api:5000/api/whatsapp/webhook
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
        reservations:
          cpus: '0.15'
          memory: 128M
    networks:
      - operabeauty-network

  caddy:
    image: ${CADDY_IMAGE:-operabeauty-caddy}:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: operabeauty-caddy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 || nc -z localhost 443 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    ports:
      - "${PORT_HTTP:-8080}:80"
      - "${PORT_HTTPS:-8443}:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
      TZ: America/Sao_Paulo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.10'
          memory: 64M
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./dist:/srv/dist:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
    networks:
      - operabeauty-network

volumes:
  operabeauty-pgdata:
  caddy_data:
  caddy_config:
  operabeauty-uploads:
  operabeauty-private-uploads:

networks:
  operabeauty-network:
    driver: bridge
