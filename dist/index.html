<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>OperaBeauty</title>
    <!-- PWA & Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" id="apple-title" content="OperaBeauty" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="theme-color" content="#be185d" />
    
    <script>
      // ============================================================
      // PWA DINÂMICO MULTI-TENANT — Manifest via URL Real
      // O iOS Safari só mantém o modo standalone com manifests
      // servidos via URL HTTP real (não data: URI).
      // Este script detecta a rota atual e injeta o <link rel="manifest">
      // apontando para /api/manifest/:slug que retorna JSON dinâmico.
      // ============================================================
      (function() {
        var path = window.location.pathname;
        
        // Rotas globais que NÃO pertencem a um tenant
        var globalRoutes = ['/', '/privacidade', '/termos'];
        var isGlobalRoute = globalRoutes.indexOf(path) !== -1 || path.indexOf('/superadmin') === 0;
        
        if (!isGlobalRoute) {
          // --- PWA TENANT-SPECIFIC ---
          var segments = path.split('/').filter(Boolean);
          if (segments.length > 0) {
            var slug = segments[0];
            var isStaff = path.indexOf('/staff') !== -1;
            
            // Nome exibido no PWA (provisório até o React carregar os dados reais)
            var pwaName = slug.charAt(0).toUpperCase() + slug.slice(1);
            if (isStaff) {
              pwaName = pwaName + ' - Staff';
            }
            
            // Manifest servido pelo backend via URL real
            var manifestUrl = '/api/manifest/' + slug + (isStaff ? '?mode=staff' : '');
            
            // Injeção síncrona do link rel="manifest" com URL real
            document.write('<link rel="manifest" id="dynamic-manifest" href="' + manifestUrl + '">');
            
            // Atualiza Apple-specific meta tags para iOS
            var appleMeta = document.getElementById('apple-title');
            if (appleMeta) { appleMeta.content = pwaName; }
            
            // Salva informações no localStorage para que o React possa recuperar
            try {
              localStorage.setItem('operabeauty_last_tenant', slug);
              localStorage.setItem('operabeauty_pwa_mode', isStaff ? 'staff' : 'client');
            } catch(e) {}
          }
        } else {
          // --- PWA GLOBAL (Landing Page) ---
          var lastTenant = null;
          try { lastTenant = localStorage.getItem('operabeauty_last_tenant'); } catch(e) {}
          
          if (lastTenant && path === '/') {
            // Se está em standalone mode (já instalou como PWA), redireciona para o último tenant
            if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) {
              var lastMode = null;
              try { lastMode = localStorage.getItem('operabeauty_pwa_mode'); } catch(e) {}
              var redirectUrl = lastMode === 'staff' 
                ? '/' + lastTenant + '/staff/login' 
                : '/' + lastTenant + '/home';
              window.location.replace(redirectUrl);
            }
          }
          
          // Manifest global genérico
          var globalM = {
            name: 'OperaBeauty',
            short_name: 'OperaBeauty',
            description: 'Sistema de Gestão para Salões de Beleza e Barbearias',
            display: 'standalone',
            start_url: '/',
            scope: '/',
            theme_color: '#be185d',
            background_color: '#ffffff',
            orientation: 'portrait',
            lang: 'pt-BR',
            icons: [
              { src: '/pwa-192x192.png', sizes: '192x192', type: 'image/png' },
              { src: '/pwa-512x512.png', sizes: '512x512', type: 'image/png' },
              { src: '/pwa-512x512.png', sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
            ]
          };
          var globalEncoded = encodeURIComponent(JSON.stringify(globalM));
          var globalUrl = 'data:application/manifest+json;charset=utf-8,' + globalEncoded;
          document.write('<link rel="manifest" id="dynamic-manifest" href="' + globalUrl + '">');
        }
      })();
    </script>

    <script type="module" crossorigin src="/assets/index-C2-GVD0Z.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-DuFNEFDu.css">
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Registro manual do Service Worker (desabilitamos auto-register no Vite) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(registration) {
              console.log('[PWA] Service Worker registrado com sucesso:', registration.scope);
            })
            .catch(function(error) {
              console.warn('[PWA] Falha ao registrar Service Worker:', error);
            });
        });
      }
    </script>
  </body>
</html>
